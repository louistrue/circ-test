[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-product-matching"
version = "2.0.0"
description = "Enhanced IFC product matching with hybrid retrieve-rerank pipeline, geometric proximity analysis, and graph write-back"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kasimir Forth (original)"},
]

dependencies = [
    "sentence-transformers>=3.0",
    "openai>=1.0",
    "numpy>=1.26",
    "ifcopenshell>=0.8",
    "neo4j>=5.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
anthropic = [
    "anthropic>=0.40",
]

[project.scripts]
ifc-match = "ifc_matching.cli:main"

[tool.setuptools.packages.find]
include = ["ifc_matching*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
